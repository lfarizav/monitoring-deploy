apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-srsgnb
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  srsgnb-monitoring.json: |
    {
      "annotations": {
        "list": [{
          "builtIn": 1,
          "datasource": {"type": "grafana", "uid": "-- Grafana --"},
          "enable": true,
          "hide": true,
          "iconColor": "rgba(0, 211, 255, 1)",
          "name": "Annotations & Alerts",
          "type": "dashboard"
        }]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0},
          "id": 100,
          "title": "srsRAN gNB",
          "type": "row"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 2},
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 1},
          "id": 1,
          "options": {"tooltip": {"mode": "multi"}},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"k8s-open5gs\",pod=~\".*gnb.*|.*srsgnb.*\",container!=\"\",container!=\"POD\"}[5m])) by (pod)",
            "legendFormat": "{{pod}} CPU",
            "refId": "A"
          }],
          "title": "srsGNB CPU Usage",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 2},
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 1},
          "id": 2,
          "options": {"tooltip": {"mode": "multi"}},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum(container_memory_working_set_bytes{namespace=\"k8s-open5gs\",pod=~\".*gnb.*|.*srsgnb.*\",container!=\"\",container!=\"POD\"}) by (pod)",
            "legendFormat": "{{pod}} Memory",
            "refId": "A"
          }],
          "title": "srsGNB Memory Usage",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 2},
              "unit": "Bps"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 9},
          "id": 3,
          "options": {"tooltip": {"mode": "multi"}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"k8s-open5gs\",pod=~\".*gnb.*|.*srsgnb.*\"}[5m])) by (pod)",
              "legendFormat": "{{pod}} RX",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"k8s-open5gs\",pod=~\".*gnb.*|.*srsgnb.*\"}[5m])) by (pod)",
              "legendFormat": "{{pod}} TX",
              "refId": "B"
            }
          ],
          "title": "srsGNB Network Traffic",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 17},
          "id": 101,
          "title": "5G Core Network Functions",
          "type": "row"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 2},
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 18},
          "id": 4,
          "options": {"tooltip": {"mode": "multi"}},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"k8s-open5gs\",pod=~\".*-amf.*|.*-smf.*|.*-upf.*|.*-nrf.*|.*-ausf.*|.*-udm.*|.*-udr.*|.*-bsf.*|.*-pcf.*|.*-nssf.*\",container!=\"\",container!=\"POD\"}[5m])) by (pod)",
            "legendFormat": "{{pod}}",
            "refId": "A"
          }],
          "title": "5G Core NF CPU Usage",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 2},
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 18},
          "id": 5,
          "options": {"tooltip": {"mode": "multi"}},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum(container_memory_working_set_bytes{namespace=\"k8s-open5gs\",pod=~\".*-amf.*|.*-smf.*|.*-upf.*|.*-nrf.*|.*-ausf.*|.*-udm.*|.*-udr.*|.*-bsf.*|.*-pcf.*|.*-nssf.*\",container!=\"\",container!=\"POD\"}) by (pod)",
            "legendFormat": "{{pod}}",
            "refId": "A"
          }],
          "title": "5G Core NF Memory Usage",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 2},
              "unit": "Bps"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 26},
          "id": 6,
          "options": {"tooltip": {"mode": "multi"}},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"k8s-open5gs\",pod=~\".*-amf.*|.*-smf.*|.*-upf.*|.*-nrf.*|.*-ausf.*|.*-udm.*|.*-udr.*|.*-bsf.*|.*-pcf.*|.*-nssf.*\"}[5m])) by (pod)",
            "legendFormat": "{{pod}} RX",
            "refId": "A"
          }],
          "title": "5G Core NF Network RX",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 2},
              "unit": "Bps"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 26},
          "id": 7,
          "options": {"tooltip": {"mode": "multi"}},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"k8s-open5gs\",pod=~\".*-amf.*|.*-smf.*|.*-upf.*|.*-nrf.*|.*-ausf.*|.*-udm.*|.*-udr.*|.*-bsf.*|.*-pcf.*|.*-nssf.*\"}[5m])) by (pod)",
            "legendFormat": "{{pod}} TX",
            "refId": "A"
          }],
          "title": "5G Core NF Network TX",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["5g", "srsran", "open5gs", "gnb"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "srsRAN gNB + 5G Core Monitoring",
      "uid": "srsgnb-monitoring",
      "version": 1,
      "weekStart": ""
    }
